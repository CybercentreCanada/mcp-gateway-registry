{{- /*
Standalone OpenBao init + bootstrap (entirely Kubernetes-driven; no KMS/SM).

A post-install/post-upgrade hook Job that is fully idempotent and re-runnable:

  1. Wait for the OpenBao pod to answer (it boots SEALED + uninitialized).
  2. If uninitialized: `operator init` with Shamir 1-of-1, then write the single
     unseal key + the root token into the `openbao-keys` Secret via the k8s API
     (using the Job SA's projected token + CA — no kubectl/secret pre-creation).
     The unseal sidecar (configured in values) consumes that key on every boot.
  3. Unseal using the stored key (no-op if already unsealed).
  4. Using the root token: ensure the KV v2 mount, write the `mcp-egress` policy,
     enable `kubernetes` auth, and create the `registry-egress` role bound to the
     registry-egress ServiceAccount in this namespace.

Gated on the egress vault being enabled on the registry subchart AND OpenBao
being deployed by this stack.
*/ -}}
{{- $egressEnabled := false }}
{{- if and .Values.registry .Values.registry.egressAuth }}
  {{- $egressEnabled = .Values.registry.egressAuth.enabled | default false }}
{{- end }}
{{- $openbaoEnabled := false }}
{{- if .Values.openbao }}
  {{- $openbaoEnabled = .Values.openbao.enabled | default false }}
{{- end }}
{{- /*
  global.openbaoInitEnabled (default true) provides an escape hatch for
  air-gapped clusters where the init job image cannot apt-install curl/jq/kubectl.
  Set to false to skip only the init job; the OpenBao StatefulSet still deploys.
*/ -}}
{{- $initEnabled := true }}
{{- if hasKey .Values.global "openbaoInitEnabled" }}
  {{- $initEnabled = .Values.global.openbaoInitEnabled }}
{{- end }}
{{- if and $egressEnabled $openbaoEnabled $initEnabled }}
{{- $ns := .Release.Namespace }}
{{- $kvMount := "secret" }}
{{- $egressPrefix := "mcp/egress" }}
{{- if .Values.registry.egressAuth.secretsManager }}
  {{- $egressPrefix = .Values.registry.egressAuth.secretsManager.pathPrefix | default "mcp/egress" }}
{{- end }}
{{- $role := "registry" }}
{{- if .Values.registry.egressAuth.openbao }}
  {{- $role = .Values.registry.egressAuth.openbao.role | default "registry" }}
{{- end }}
{{- /* The registry pod runs as this ServiceAccount (registry chart's
       serviceAccount.name, default app name "registry"); the OpenBao role binds
       to it. */ -}}
{{- $registrySa := "registry" }}
{{- if and .Values.registry .Values.registry.serviceAccount .Values.registry.serviceAccount.name }}
  {{- $registrySa = .Values.registry.serviceAccount.name }}
{{- end }}
{{- /* The OpenBao server ServiceAccount (subchart fullname; holds
       system:auth-delegator via "<fullname>-server-binding"). Its long-lived
       token is used as the kubernetes-auth token_reviewer_jwt. */ -}}
{{- $openbaoSa := include "mcp-gateway-registry-stack.openbaoName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-init
  namespace: {{ $ns | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-init
  namespace: {{ $ns | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # Read/create/update the keys Secret (operator init output) and the OpenBao
  # server SA's long-lived token Secret (used as the kubernetes-auth
  # token_reviewer_jwt). create needs collection-level create.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-init
  namespace: {{ $ns | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-init
subjects:
  - kind: ServiceAccount
    name: openbao-init
    namespace: {{ $ns | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
  namespace: {{ $ns | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "mcp-gateway-registry-stack.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: openbao-init
      containers:
        - name: init
          # AWS-mirrored Docker library image (no Bitnami, no Docker Hub rate
          # limits) -- matches the keycloak-configure / mongodb-configure house
          # pattern. We apt-install curl + jq + kubectl at runtime: curl drives
          # OpenBao's plain-HTTP REST API (tls_disable=1, no TLS to fight); jq
          # parses the init JSON robustly; kubectl writes the keys Secret with
          # proper k8s TLS (busybox wget in the openbao image cannot verify the
          # API cert -- the original failure mode).
          image: {{ .Values.global.openbaoInitImage | default "public.ecr.aws/docker/library/python:3.14-slim" }}
          env:
            - name: BAO_ADDR
              value: "http://{{ include "mcp-gateway-registry-stack.openbaoServiceHost" . }}:8200"
            - name: KEYS_SECRET
              value: "openbao-keys"
            - name: NAMESPACE
              value: {{ $ns | quote }}
            - name: KV_MOUNT
              value: {{ $kvMount | quote }}
            - name: EGRESS_PREFIX
              value: {{ $egressPrefix | quote }}
            - name: ROLE
              value: {{ $role | quote }}
            - name: REGISTRY_SA
              value: {{ $registrySa | quote }}
            - name: OPENBAO_SA
              value: {{ $openbaoSa | quote }}
            - name: REVIEWER_SECRET
              value: "openbao-reviewer-token"
          command:
            - python3
            - -c
            - |
              # Pure Python replacement for the shell+apt-get init script.
              # Uses only stdlib (urllib.request, json, ssl, base64, os, time)
              # so no apt-get / pip is required in the container image.
              import base64, json, os, ssl, sys, time, urllib.request, urllib.error

              BAO_ADDR       = os.environ["BAO_ADDR"]
              NAMESPACE      = os.environ["NAMESPACE"]
              KEYS_SECRET    = os.environ["KEYS_SECRET"]
              KV_MOUNT       = os.environ["KV_MOUNT"]
              EGRESS_PREFIX  = os.environ["EGRESS_PREFIX"]
              ROLE           = os.environ["ROLE"]
              REGISTRY_SA    = os.environ["REGISTRY_SA"]
              OPENBAO_SA     = os.environ["OPENBAO_SA"]
              REVIEWER_SECRET= os.environ["REVIEWER_SECRET"]

              SA_TOKEN_FILE  = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              SA_CA_FILE     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              K8S_HOST       = "https://kubernetes.default.svc"

              with open(SA_TOKEN_FILE) as f:
                  K8S_TOKEN = f.read().strip()

              bao_token = [None]  # mutable so nested helpers can update it

              def bao(method, path, body=None):
                  headers = {"Content-Type": "application/json"}
                  if bao_token[0]:
                      headers["X-Vault-Token"] = bao_token[0]
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(
                      f"{BAO_ADDR}/v1/{path}", data=data, headers=headers, method=method)
                  try:
                      resp = urllib.request.urlopen(req, timeout=10)
                      return json.loads(resp.read())
                  except urllib.error.HTTPError as e:
                      return json.loads(e.read() or b"{}")

              def k8s(method, path, body=None):
                  ctx = ssl.create_default_context(cafile=SA_CA_FILE)
                  headers = {
                      "Authorization": f"Bearer {K8S_TOKEN}",
                      "Content-Type": "application/json",
                  }
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(
                      f"{K8S_HOST}{path}", data=data, headers=headers, method=method)
                  try:
                      resp = urllib.request.urlopen(req, context=ctx, timeout=10)
                      return json.loads(resp.read())
                  except urllib.error.HTTPError as e:
                      txt = e.read() or b"{}"
                      return {"_status": e.code, **json.loads(txt)}

              def k8s_apply(path, body):
                  """Create or update a K8s resource."""
                  r = k8s("POST", path, body)
                  if r.get("_status") == 409:  # already exists — patch
                      name = body["metadata"]["name"]
                      r = k8s("PATCH", f"{path}/{name}", body)
                  return r

              # 1. Wait for OpenBao
              print("waiting for openbao to answer...", flush=True)
              for _ in range(60):
                  try:
                      urllib.request.urlopen(
                          f"{BAO_ADDR}/v1/sys/health?uninitcode=200&sealedcode=200",
                          timeout=3)
                      break
                  except Exception:
                      time.sleep(2)

              # 2. Init / read existing keys
              info = bao("GET", "sys/init")
              if info.get("initialized"):
                  print("already initialized — reading keys from secret", flush=True)
                  sec = k8s("GET", f"/api/v1/namespaces/{NAMESPACE}/secrets/{KEYS_SECRET}")
                  d = sec.get("data", {})
                  unseal_key = base64.b64decode(d["unseal_key"]).decode() if "unseal_key" in d else ""
                  root_token  = base64.b64decode(d["root_token"]).decode()  if "root_token"  in d else ""
                  if not unseal_key or not root_token:
                      sys.exit(
                          f"FATAL: vault is initialized but {KEYS_SECRET} has no keys; "
                          "delete the OpenBao PVC to re-init from scratch.")
              else:
                  print("initializing (Shamir 1-of-1)...", flush=True)
                  init = bao("PUT", "sys/init", {"secret_shares": 1, "secret_threshold": 1})
                  unseal_key = init.get("keys_base64", [None])[0]
                  root_token  = init.get("root_token")
                  if not unseal_key or unseal_key == "null":
                      sys.exit("init produced no unseal key")
                  # Persist BEFORE anything else so a crash cannot lose keys.
                  k8s_apply(f"/api/v1/namespaces/{NAMESPACE}/secrets", {
                      "apiVersion": "v1", "kind": "Secret",
                      "metadata": {"name": KEYS_SECRET, "namespace": NAMESPACE},
                      "data": {
                          "unseal_key": base64.b64encode(unseal_key.encode()).decode(),
                          "root_token":  base64.b64encode(root_token.encode()).decode(),
                      },
                  })
                  print(f"keys stored in Secret/{KEYS_SECRET}", flush=True)

              # 3. Unseal if sealed
              status = bao("GET", "sys/seal-status")
              if status.get("sealed"):
                  print("unsealing...", flush=True)
                  bao("PUT", "sys/unseal", {"key": unseal_key})
              bao_token[0] = root_token

              # 4. KV v2 mount
              print(f"ensuring KV v2 mount '{KV_MOUNT}'...", flush=True)
              mounts = bao("GET", "sys/mounts")
              existing = mounts.get("data", mounts)
              if f"{KV_MOUNT}/" not in existing:
                  bao("POST", f"sys/mounts/{KV_MOUNT}",
                      {"type": "kv", "options": {"version": "2"}})

              # 5. Policy
              print("writing policy mcp-egress...", flush=True)
              policy = (
                  f'path "{KV_MOUNT}/data/{EGRESS_PREFIX}/*" '
                  '{ capabilities = ["create","read","update","delete"] }\n'
                  f'path "{KV_MOUNT}/metadata/{EGRESS_PREFIX}/*" '
                  '{ capabilities = ["read","delete","list"] }\n'
                  f'path "{KV_MOUNT}/metadata/{EGRESS_PREFIX}" '
                  '{ capabilities = ["list"] }'
              )
              bao("PUT", "sys/policies/acl/mcp-egress", {"policy": policy})

              # 6. Kubernetes auth method
              print("enabling kubernetes auth...", flush=True)
              auth_mounts = bao("GET", "sys/auth")
              auth_existing = auth_mounts.get("data", auth_mounts)
              if "kubernetes/" not in auth_existing:
                  bao("POST", "sys/auth/kubernetes", {"type": "kubernetes"})

              # 7. Reviewer-token Secret (non-expiring SA token for stable TokenReview)
              print(f"ensuring reviewer-token Secret {REVIEWER_SECRET} for SA {OPENBAO_SA}...",
                    flush=True)
              k8s_apply(f"/api/v1/namespaces/{NAMESPACE}/secrets", {
                  "apiVersion": "v1", "kind": "Secret",
                  "metadata": {
                      "name": REVIEWER_SECRET, "namespace": NAMESPACE,
                      "annotations": {"kubernetes.io/service-account.name": OPENBAO_SA},
                  },
                  "type": "kubernetes.io/service-account-token",
              })
              reviewer_jwt = ""
              for _ in range(30):
                  s = k8s("GET", f"/api/v1/namespaces/{NAMESPACE}/secrets/{REVIEWER_SECRET}")
                  token_b64 = s.get("data", {}).get("token", "")
                  if token_b64:
                      reviewer_jwt = base64.b64decode(token_b64).decode()
                      break
                  time.sleep(2)
              if not reviewer_jwt:
                  sys.exit("FATAL: reviewer token Secret never populated")

              # 8. Configure kubernetes auth backend
              print("configuring kubernetes auth (with stable token_reviewer_jwt)...",
                    flush=True)
              with open(SA_CA_FILE) as f:
                  ca_cert = f.read()
              bao("POST", "auth/kubernetes/config", {
                  "kubernetes_host": "https://kubernetes.default.svc",
                  "kubernetes_ca_cert": ca_cert,
                  "token_reviewer_jwt": reviewer_jwt,
                  "disable_iss_validation": True,
              })

              # 9. Role
              print(f"creating role {ROLE} (sa={REGISTRY_SA} ns={NAMESPACE})...", flush=True)
              bao("POST", f"auth/kubernetes/role/{ROLE}", {
                  "bound_service_account_names": REGISTRY_SA,
                  "bound_service_account_namespaces": NAMESPACE,
                  "policies": "mcp-egress",
                  "ttl": "1h",
              })

              print("DONE", flush=True)
{{- end }}
