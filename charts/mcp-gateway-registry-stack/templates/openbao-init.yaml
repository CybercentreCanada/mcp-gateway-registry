{{- /*
Standalone OpenBao init + bootstrap (entirely Kubernetes-driven; no KMS/SM).

A post-install/post-upgrade hook Job that is fully idempotent and re-runnable:

  1. Wait for the OpenBao pod to answer (it boots SEALED + uninitialized).
  2. If uninitialized: `operator init` with Shamir 1-of-1, then write the single
     unseal key + the root token into the `openbao-keys` Secret via the k8s API
     (using the Job SA's projected token + CA — no kubectl/secret pre-creation).
     The unseal sidecar (configured in values) consumes that key on every boot.
  3. Unseal using the stored key (no-op if already unsealed).
  4. Using the root token: ensure the KV v2 mount, write the `mcp-egress` policy,
     enable `kubernetes` auth (at egressAuth.openbao.authMount when the registry
     logs in with it, else auth/kubernetes), and create the `registry-egress`
     role bound to the registry-egress ServiceAccount in this namespace.

Gated on the egress vault being enabled on the registry subchart AND OpenBao
being deployed by this stack.
*/ -}}
{{- $egressEnabled := false }}
{{- if and .Values.registry .Values.registry.egressAuth }}
  {{- $egressEnabled = .Values.registry.egressAuth.enabled | default false }}
{{- end }}
{{- $openbaoEnabled := false }}
{{- if .Values.openbao }}
  {{- $openbaoEnabled = .Values.openbao.enabled | default false }}
{{- end }}
{{- /* global.openbaoInitEnabled (default true): skip only the init Job when its image
       cannot be used (air-gapped clusters). The OpenBao StatefulSet still deploys. */ -}}
{{- $initEnabled := true }}
{{- if hasKey .Values.global "openbaoInitEnabled" }}
  {{- $initEnabled = .Values.global.openbaoInitEnabled }}
{{- end }}
{{- if and $egressEnabled $openbaoEnabled $initEnabled }}
{{- $ns := .Release.Namespace }}
{{- $kvMount := "secret" }}
{{- $egressPrefix := "mcp/egress" }}
{{- if .Values.registry.egressAuth.secretsManager }}
  {{- $egressPrefix = .Values.registry.egressAuth.secretsManager.pathPrefix | default "mcp/egress" }}
{{- end }}
{{- $role := "registry" }}
{{- $authMount := "kubernetes" }}
{{- if .Values.registry.egressAuth.openbao }}
  {{- $role = .Values.registry.egressAuth.openbao.role | default "registry" }}
  {{- /* Enable kubernetes auth at the mount the registry logs in through
         (OPENBAO_AUTH_MOUNT, trimmed the same way). Only for the kubernetes
         method: with approle the mount belongs to approle, not to this job. */ -}}
  {{- if eq (.Values.registry.egressAuth.openbao.authMethod | default "token") "kubernetes" }}
    {{- $authMount = .Values.registry.egressAuth.openbao.authMount | default "" | trim | trimAll "/" | default "kubernetes" }}
  {{- end }}
{{- end }}
{{- /* The registry pod runs as this ServiceAccount (registry chart's
       serviceAccount.name, default app name "registry"); the OpenBao role binds
       to it. */ -}}
{{- $registrySa := "registry" }}
{{- if and .Values.registry .Values.registry.serviceAccount .Values.registry.serviceAccount.name }}
  {{- $registrySa = .Values.registry.serviceAccount.name }}
{{- end }}
{{- /* The OpenBao server ServiceAccount (subchart fullname; holds
       system:auth-delegator via "<fullname>-server-binding"). Its long-lived
       token is used as the kubernetes-auth token_reviewer_jwt. */ -}}
{{- $openbaoSa := include "mcp-gateway-registry-stack.openbaoName" . }}
{{- /* Auth-server OBO exchanged-token cache: when enabled, the
       auth-server becomes a SecretStore client for its OWN reserved "obo-cache"
       namespace only. We bind its ServiceAccount to a SEPARATE, SCOPED OpenBao
       role+policy -- never the registry's broad mcp-egress policy. */ -}}
{{- $authServerValues := (index .Values "auth-server") | default dict }}
{{- $authEgress := $authServerValues.egressAuth | default dict }}
{{- $oboCacheEnabled := eq ($authEgress.oboCacheEnabled | default "false" | toString) "true" }}
{{- $authServerSa := "auth-server" }}
{{- if and $authServerValues.serviceAccount $authServerValues.serviceAccount.name }}
  {{- $authServerSa = $authServerValues.serviceAccount.name }}
{{- end }}
{{- $oboRole := "auth-server-obo-cache" }}
{{- if $authEgress.openbao }}
  {{- $oboRole = $authEgress.openbao.role | default "auth-server-obo-cache" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-init
  namespace: {{ $ns | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-init
  namespace: {{ $ns | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # Read/create/update the keys Secret (operator init output) and the OpenBao
  # server SA's long-lived token Secret (used as the kubernetes-auth
  # token_reviewer_jwt). create needs collection-level create.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-init
  namespace: {{ $ns | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-init
subjects:
  - kind: ServiceAccount
    name: openbao-init
    namespace: {{ $ns | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
  namespace: {{ $ns | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "mcp-gateway-registry-stack.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: openbao-init
      containers:
        - name: init
          # Only python3 is needed: the script below uses the standard library to
          # drive OpenBao's plain-HTTP API (tls_disable=1) and the Kubernetes API
          # (service-account token + CA), so no apt-get, curl, jq or kubectl at runtime.
          # Mirror the image and point global.openbaoInitImage at it when
          # public.ecr.aws is not reachable.
          image: {{ .Values.global.openbaoInitImage | default "public.ecr.aws/docker/library/python:3.14-slim" | quote }}
          env:
            - name: BAO_ADDR
              value: "http://{{ include "mcp-gateway-registry-stack.openbaoServiceHost" . }}:8200"
            - name: KEYS_SECRET
              value: "openbao-keys"
            - name: NAMESPACE
              value: {{ $ns | quote }}
            - name: KV_MOUNT
              value: {{ $kvMount | quote }}
            - name: EGRESS_PREFIX
              value: {{ $egressPrefix | quote }}
            - name: ROLE
              value: {{ $role | quote }}
            - name: AUTH_MOUNT
              value: {{ $authMount | quote }}
            - name: REGISTRY_SA
              value: {{ $registrySa | quote }}
            - name: OPENBAO_SA
              value: {{ $openbaoSa | quote }}
            - name: REVIEWER_SECRET
              value: "openbao-reviewer-token"
            - name: OBO_CACHE_ENABLED
              value: {{ $oboCacheEnabled | toString | quote }}
            - name: AUTH_SERVER_SA
              value: {{ $authServerSa | quote }}
            - name: OBO_ROLE
              value: {{ $oboRole | quote }}
          command:
            - python3
            - -c
            - |
              # Init for the OpenBao egress vault using only the Python standard library,
              # so it runs from a mirrored python image on a network that cannot reach
              # public package repositories.
              import base64
              import json
              import os
              import ssl
              import sys
              import time
              import urllib.error
              import urllib.request

              BAO_ADDR = os.environ["BAO_ADDR"]
              NAMESPACE = os.environ["NAMESPACE"]
              KEYS_SECRET = os.environ["KEYS_SECRET"]
              KV_MOUNT = os.environ["KV_MOUNT"]
              EGRESS_PREFIX = os.environ["EGRESS_PREFIX"]
              ROLE = os.environ["ROLE"]
              AUTH_MOUNT = os.environ["AUTH_MOUNT"]
              REGISTRY_SA = os.environ["REGISTRY_SA"]
              OPENBAO_SA = os.environ["OPENBAO_SA"]
              REVIEWER_SECRET = os.environ["REVIEWER_SECRET"]
              OBO_CACHE_ENABLED = os.environ["OBO_CACHE_ENABLED"] == "true"
              AUTH_SERVER_SA = os.environ["AUTH_SERVER_SA"]
              OBO_ROLE = os.environ["OBO_ROLE"]

              SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
              K8S_HOST = "https://kubernetes.default.svc"
              # enc("obo-cache"): the reserved path segment the auth-server cache writes under.
              OBO_SEGMENT = "b2JvLWNhY2hl"

              with open(SA_DIR + "/token") as f:
                  K8S_TOKEN = f.read().strip()
              K8S_CTX = ssl.create_default_context(cafile=SA_DIR + "/ca.crt")
              bao_token = [None]


              def log(msg):
                  print(msg, flush=True)


              def call(url, method, headers, body, ctx=None):
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      resp = urllib.request.urlopen(req, context=ctx, timeout=10)
                      status, raw = resp.status, resp.read()
                  except urllib.error.HTTPError as e:
                      status, raw = e.code, e.read()
                  try:
                      parsed = json.loads(raw) if raw else {}
                  except ValueError:
                      parsed = {}
                  return status, parsed


              def bao(method, path, body=None):
                  headers = {"Content-Type": "application/json"}
                  if bao_token[0]:
                      headers["X-Vault-Token"] = bao_token[0]
                  status, parsed = call(BAO_ADDR + "/v1/" + path, method, headers, body)
                  if status >= 400:
                      print("WARN: " + method + " " + path + " -> HTTP " + str(status), file=sys.stderr, flush=True)
                  return parsed


              def k8s(method, path, body=None, content_type="application/json"):
                  headers = {"Authorization": "Bearer " + K8S_TOKEN, "Content-Type": content_type}
                  return call(K8S_HOST + path, method, headers, body, K8S_CTX)


              def k8s_apply(collection_path, body):
                  """Create the object, or merge-patch it when it already exists."""
                  status, parsed = k8s("POST", collection_path, body)
                  if status == 409:
                      name = body["metadata"]["name"]
                      status, parsed = k8s("PATCH", collection_path + "/" + name, body, "application/merge-patch+json")
                  if status >= 400:
                      sys.exit("FATAL: could not write " + collection_path + " (HTTP " + str(status) + ")")
                  return parsed


              def secret_value(name, key):
                  status, parsed = k8s("GET", "/api/v1/namespaces/" + NAMESPACE + "/secrets/" + name)
                  value = parsed.get("data", {}).get(key, "") if status < 400 else ""
                  return base64.b64decode(value).decode() if value else ""


              def b64(text):
                  return base64.b64encode(text.encode()).decode()


              def policy_for(*rules):
                  return "\n".join('path "' + path + '" { capabilities = [' + ",".join('"' + c + '"' for c in caps) + "] }" for path, caps in rules)


              log("waiting for openbao to answer...")
              for _ in range(60):
                  try:
                      urllib.request.urlopen(BAO_ADDR + "/v1/sys/health?uninitcode=200&sealedcode=200", timeout=3)
                      break
                  except Exception:
                      time.sleep(2)

              # 1. init if needed
              if bao("GET", "sys/init").get("initialized"):
                  log("already initialized")
                  unseal_key = secret_value(KEYS_SECRET, "unseal_key")
                  root_token = secret_value(KEYS_SECRET, "root_token")
                  if not unseal_key or not root_token:
                      sys.exit(
                          "FATAL: vault is initialized but " + KEYS_SECRET + " has no keys; the unseal key/root "
                          "token are unrecoverable. Delete the OpenBao PVC to re-init from scratch."
                      )
              else:
                  log("initializing (Shamir 1-of-1)...")
                  init = bao("PUT", "sys/init", {"secret_shares": 1, "secret_threshold": 1})
                  unseal_key = (init.get("keys_base64") or [None])[0]
                  root_token = init.get("root_token")
                  if not unseal_key or not root_token:
                      sys.exit("init produced no unseal key or root token")
                  # Persist BEFORE anything else so a crash cannot lose the keys.
                  k8s_apply("/api/v1/namespaces/" + NAMESPACE + "/secrets", {
                      "apiVersion": "v1",
                      "kind": "Secret",
                      "metadata": {"name": KEYS_SECRET, "namespace": NAMESPACE},
                      "data": {"unseal_key": b64(unseal_key), "root_token": b64(root_token)},
                  })
                  log("keys stored in Secret/" + KEYS_SECRET)

              # 2. unseal (no-op if already unsealed)
              if bao("GET", "sys/seal-status").get("sealed"):
                  log("unsealing...")
                  bao("PUT", "sys/unseal", {"key": unseal_key})
              bao_token[0] = root_token

              # 3. KV v2 mount, policy, kubernetes auth method
              log("ensuring KV v2 mount '" + KV_MOUNT + "'...")
              mounts = bao("GET", "sys/mounts")
              if KV_MOUNT + "/" not in mounts.get("data", mounts):
                  bao("POST", "sys/mounts/" + KV_MOUNT, {"type": "kv", "options": {"version": "2"}})

              log("writing policy mcp-egress...")
              bao("PUT", "sys/policies/acl/mcp-egress", {"policy": policy_for(
                  (KV_MOUNT + "/data/" + EGRESS_PREFIX + "/*", ["create", "read", "update", "delete"]),
                  (KV_MOUNT + "/metadata/" + EGRESS_PREFIX + "/*", ["read", "delete", "list"]),
                  (KV_MOUNT + "/metadata/" + EGRESS_PREFIX, ["list"]),
              )})

              log("enabling kubernetes auth at " + AUTH_MOUNT + "...")
              auth_mounts = bao("GET", "sys/auth")
              if AUTH_MOUNT + "/" not in auth_mounts.get("data", auth_mounts):
                  bao("POST", "sys/auth/" + AUTH_MOUNT, {"type": "kubernetes"})

              # A stable token_reviewer_jwt. Without it OpenBao reviews logins with its own pod's
              # projected token, which the kubelet rotates; OpenBao caches it and every login
              # then fails with "permission denied" once it lapses. A service-account-token
              # Secret yields a non-expiring token for the OpenBao server SA.
              log("ensuring reviewer-token Secret " + REVIEWER_SECRET + " for SA " + OPENBAO_SA + "...")
              k8s_apply("/api/v1/namespaces/" + NAMESPACE + "/secrets", {
                  "apiVersion": "v1",
                  "kind": "Secret",
                  "metadata": {
                      "name": REVIEWER_SECRET,
                      "namespace": NAMESPACE,
                      "annotations": {"kubernetes.io/service-account.name": OPENBAO_SA},
                  },
                  "type": "kubernetes.io/service-account-token",
              })
              reviewer_jwt = ""
              for _ in range(30):
                  reviewer_jwt = secret_value(REVIEWER_SECRET, "token")
                  if reviewer_jwt:
                      break
                  time.sleep(2)
              if not reviewer_jwt:
                  sys.exit("FATAL: reviewer token Secret never populated")

              log("configuring kubernetes auth (with stable token_reviewer_jwt)...")
              with open(SA_DIR + "/ca.crt") as f:
                  ca_cert = f.read()
              bao("POST", "auth/" + AUTH_MOUNT + "/config", {
                  "kubernetes_host": K8S_HOST,
                  "kubernetes_ca_cert": ca_cert,
                  "token_reviewer_jwt": reviewer_jwt,
                  "disable_iss_validation": True,
              })

              log("creating role " + ROLE + " (sa=" + REGISTRY_SA + " ns=" + NAMESPACE + ")...")
              bao("POST", "auth/" + AUTH_MOUNT + "/role/" + ROLE, {
                  "bound_service_account_names": REGISTRY_SA,
                  "bound_service_account_namespaces": NAMESPACE,
                  "policies": "mcp-egress",
                  "ttl": "1h",
              })

              # 4. auth-server OBO cache: a policy limited to the reserved obo-cache segment
              # (no delete: the cache never deletes) and a role for the auth-server SA.
              if OBO_CACHE_ENABLED:
                  log("writing scoped policy mcp-obo-cache...")
                  bao("PUT", "sys/policies/acl/mcp-obo-cache", {"policy": policy_for(
                      (KV_MOUNT + "/data/" + EGRESS_PREFIX + "/" + OBO_SEGMENT + "/*", ["create", "read", "update"]),
                      (KV_MOUNT + "/metadata/" + EGRESS_PREFIX + "/" + OBO_SEGMENT + "/*", ["read", "list"]),
                  )})
                  log("creating role " + OBO_ROLE + " (sa=" + AUTH_SERVER_SA + " ns=" + NAMESPACE + ")...")
                  bao("POST", "auth/" + AUTH_MOUNT + "/role/" + OBO_ROLE, {
                      "bound_service_account_names": AUTH_SERVER_SA,
                      "bound_service_account_namespaces": NAMESPACE,
                      "policies": "mcp-obo-cache",
                      "ttl": "1h",
                  })

              log("DONE")
{{- end }}
