{{- $existingSecret := .Values.mongodb.existingSecret | default .Values.global.existingMongoCredentialsSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-mongodb
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    # Helm hook: delete before re-creating (avoids immutable spec errors when the
    # ConfigMap content changes) and clean up after a successful run.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: {{ .Values.pythonImage | default "public.ecr.aws/docker/library/python:3.13-slim" }}
          command: ['sh', '-c']
          envFrom:
            - secretRef:
                name: {{ $existingSecret | default "mongo-credentials" }}
          env:
            - name: HOME
              value: /tmp
            - name: PIP_NO_CACHE_DIR
              value: "1"
            {{- if .Values.pipIndexUrl }}
            - name: PIP_INDEX_URL
              value: {{ .Values.pipIndexUrl | quote }}
            {{- end }}
          args:
            - |
              echo "Installing pymongo..."
              pip install --no-cache-dir pymongo

              echo "Waiting for MongoDB replica set to be ready..."
              python3 /app/wait.py
          volumeMounts:
            - mountPath: /app/wait.py
              name: script
              subPath: wait.py
      containers:
        - name: job
          image: {{ .Values.pythonImage | default "public.ecr.aws/docker/library/python:3.13-slim" }}
          command: ["/bin/sh", "-c"]
          args: [
            "pip install --no-cache-dir pyyaml motor && python /app/script.py"
          ]
          envFrom:
            - secretRef:
                name: {{ $existingSecret | default "mongo-credentials" }}
          env:
            - name: HOME
              value: /tmp
            - name: PIP_NO_CACHE_DIR
              value: "1"
            {{- if .Values.pipIndexUrl }}
            - name: PIP_INDEX_URL
              value: {{ .Values.pipIndexUrl | quote }}
            {{- end }}
          volumeMounts:
            - mountPath: /app/script.py
              name: script
              subPath: script.py
            - mountPath: /app/registry-admins.json
              name: script
              subPath: registry-admins.json
            - mountPath: /app/mcp-registry-admin.json
              name: script
              subPath: mcp-registry-admin.json
            - mountPath: /app/mcp-servers-unrestricted-execute.json
              name: script
              subPath: mcp-servers-unrestricted-execute.json
            - mountPath: /app/mcp-servers-unrestricted-read.json
              name: script
              subPath: mcp-servers-unrestricted-read.json
            - mountPath: /app/federation-service.json
              name: script
              subPath: federation-service.json
      restartPolicy: Never
      volumes:
        - name: script
          configMap:
            name: setup-mongodb
  backoffLimit: 4
